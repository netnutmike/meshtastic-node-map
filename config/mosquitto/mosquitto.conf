# Mosquitto MQTT Broker Configuration

# Basic settings
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Security settings
allow_anonymous true
# password_file /mosquitto/config/passwd

# Connection limits
max_connections 1000
max_inflight_messages 20  # Reduced from 100 to limit memory
max_queued_messages 100  # Reduced from 1000 to limit memory

# Message size limits
max_packet_size 1048576
# message_size_limit is deprecated in Mosquitto 2.0, using max_packet_size instead

# Keep alive settings
# keepalive_interval 60

# Queue settings
queue_qos0_messages false  # Don't queue QoS 0 messages to save memory
max_queued_bytes 104857600  # 100MB max queued bytes (was 0/unlimited)

# Bridge configuration (for connecting to other brokers)
# connection bridge-01
# address remote-broker.example.com:1883
# topic msh/+/+/+/+/+ both 0


connection villagesmesh
address villagesmesh.com:1883
remote_password meshdev
remote_username large4cats
try_private false
topic msh/US/FL/# in 0


# Access control (uncomment to enable)
# acl_file /mosquitto/config/acl.conf