# Mosquitto MQTT Broker Configuration

# Basic settings
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Security settings
allow_anonymous true
# password_file /mosquitto/config/passwd

# Connection limits
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# Message size limits
max_packet_size 1048576

# Keep alive settings
# keepalive_interval 60

# Queue settings
queue_qos0_messages true
max_queued_bytes 0

# Bridge configuration (for connecting to other brokers)
# connection bridge-01
# address remote-broker.example.com:1883
# topic msh/+/+/+/+/+ both 0

connection bridge_to_meshtastic
address mqtt.meshtastic.org:1883
topic msh/US/FL/# in 0
topic msh/US/MD/# in 0
topic msh/US/PA/# in 0
topic msh/US/VA/# in 0
topic msh/US/DC/# in 0
topic msh/US/NC/# in 0
topic msh/US/DMV/# in 0
remote_username meshdev
remote_password large4cats
remote_clientid villages.mesh

connection liamcottle
address mqtt.meshtastic.liamcottle.net
remote_password uplink
remote_username uplink
try_private false
topic msh/US/FL/# out 0

connection areyoumeshingwithus
address mqtt.areyoumeshingwith.us:1883
remote_password uplink
remote_username uplink
try_private false
topic msh/US/FL/# in 0
topic msh/US/FL/# out 0

connection villagesmesh
address mqtt.villagesmesh.com:1883
remote_password meshdev
remote_username large4cats
try_private false
topic msh/US/FL/# in 0
topic msh/US/FL/# out 0

connection ncmesh
address mqtt.ncmesh.net:1883
remote_password meshdev
remote_username large4cats
try_private false
topic msh/US/# in 0


# Access control (uncomment to enable)
# acl_file /mosquitto/config/acl.conf