# Mosquitto MQTT Broker Configuration - Production

# Basic settings
listener 1883
protocol mqtt

# WebSocket listener for browser clients
listener 9001
protocol websockets

# Persistence settings
persistence false
# persistence_location /mosquitto/data/
# autosave_interval 1800

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Security settings
allow_anonymous true

# Connection limits
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# Message size limits
max_packet_size 1048576

# Queue settings
queue_qos0_messages true
max_queued_bytes 0

# Note: Bridge connections removed for production stability
# Add them back in mosquitto.conf if needed for your deployment
